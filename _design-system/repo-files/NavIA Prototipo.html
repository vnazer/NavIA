<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>NavIA · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" />
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: #08090c;
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    overflow: hidden;
  }

  /* Theme — DECK by default (this is how the app is actually used on water) */
  :root, .stage, [data-theme="deck"] {
    --bg:        #000000;
    --surface:   #0A0F18;
    --surface-2: #121925;
    --surface-3: #1A2333;
    --text:      #FFFFFF;
    --text-2:    #D6DEE8;
    --text-3:    #8FA0B6;
    --border:    #1E2839;
    --border-2:  #2C3A52;
    --navy:      #0E2A4E;
    --accent:    #00C2FF;
    --lift:      #2EF07A;
    --header:    #FF5447;
    --warn:      #FFB020;
    --info:      #00C2FF;

    --b-committee: #FF3A4A;
    --b-pin:       #FFB020;
    --b-windward:  #2EF07A;
    --b-leeward:   #3B95FF;
    --b-gate:      #A78BFA;
  }
  [data-theme="light"], [data-theme="light"] .stage {
    --bg:        #EEF2F7;
    --surface:   #FFFFFF;
    --surface-2: #F6F8FB;
    --surface-3: #ECF0F5;
    --text:      #0B1320;
    --text-2:    #475266;
    --text-3:    #8392A6;
    --border:    #E0E6EE;
    --border-2:  #C9D2DE;
    --navy:      #0E2A4E;
    --accent:    #0E6BA8;
    --lift:      #15A34A;
    --header:    #E03A2C;
    --warn:      #D97706;
    --info:      #0E6BA8;

    --b-committee: #D11A2A;
    --b-pin:       #F59E0B;
    --b-windward:  #16A34A;
    --b-leeward:   #1E6FE0;
    --b-gate:      #8B5CF6;
  }

  /* === LAYOUT ===
     On mobile (< 500px wide): full-bleed.
     On larger screens: phone bezel centered in stage. */
  #root {
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage {
    width: 100%; height: 100%;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 500px) {
    #root {
      background:
        radial-gradient(circle at 30% 20%, #161b25 0%, #08090c 60%);
    }
    .stage {
      width: 430px;
      height: min(932px, 96dvh);
      border-radius: 56px;
      box-shadow:
        0 0 0 11px #1a1f29,
        0 0 0 12px #2b3140,
        0 30px 80px rgba(0,0,0,0.5);
    }
    .notch {
      position: absolute;
      top: 12px; left: 50%;
      transform: translateX(-50%);
      width: 122px; height: 36px;
      border-radius: 20px;
      background: #000;
      z-index: 100;
      pointer-events: none;
    }
  }

  /* Status bar — only show in framed (desktop) mode */
  .statusbar {
    height: 54px;
    padding: 18px 28px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-weight: 600;
    font-size: 15px;
    flex-shrink: 0;
    color: var(--text);
    position: relative;
    z-index: 50;
  }
  @media (max-width: 499px) {
    .statusbar { display: none; }
  }

  /* Safe area pad-bottom for tab bar */
  .tabbar-pad {
    padding-bottom: max(env(safe-area-inset-bottom), 22px);
  }

  .num {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }
  .label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  /* Screen container — scrolls under fixed tab bar */
  .screen {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    position: relative;
    padding-bottom: 8px;
  }
  .screen::-webkit-scrollbar { display: none; }

  /* Tap feedback */
  .tap {
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: transform 120ms ease, opacity 120ms ease, background 120ms ease;
  }
  .tap:active { transform: scale(0.97); opacity: 0.8; }

  /* Slide-in transitions */
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .anim-slide { animation: slideIn 260ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }
  .anim-fade  { animation: fadeIn  180ms ease both; }
  .anim-up    { animation: slideUp 280ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }

  /* Number flicker — subtle pulse when value changes */
  @keyframes flicker { 0% { opacity: 0.55; } 100% { opacity: 1; } }
  .flicker { animation: flicker 380ms ease-out; }

  /* Pulse for REC indicator */
  @keyframes rec-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .rec-dot { animation: rec-pulse 1.4s ease-in-out infinite; }

  /* Modal scrim */
  .scrim {
    position: absolute; inset: 0;
    background: rgba(0, 5, 12, 0.72);
    z-index: 80;
    display: flex;
    align-items: flex-end;
    justify-content: stretch;
    animation: fadeIn 160ms ease;
  }
  .sheet {
    width: 100%;
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-radius: 28px 28px 0 0;
    padding: 8px 20px 28px;
    padding-bottom: max(env(safe-area-inset-bottom), 28px);
    animation: slideUp 280ms cubic-bezier(0.22, 0.61, 0.36, 1);
    position: relative;
  }
  .sheet-handle {
    width: 40px; height: 4px;
    background: var(--border-2);
    margin: 0 auto 14px;
    border-radius: 99px;
  }

  /* Buttons baseline */
  button {
    font-family: inherit;
    border: none; background: none; padding: 0;
    color: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="proto-shared.jsx"></script>
<script type="text/babel" src="proto-screens.jsx"></script>
<script type="text/babel" src="proto-app.jsx"></script>
</body>
</html>
