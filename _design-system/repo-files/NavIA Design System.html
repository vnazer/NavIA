<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NavIA — Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" />
<style>
  :root {
    /* LIGHT */
    --l-canvas: #EEF2F7;
    --l-surface: #FFFFFF;
    --l-surface-2: #F6F8FB;
    --l-surface-3: #ECF0F5;
    --l-text: #0B1320;
    --l-text-2: #475266;
    --l-text-3: #8392A6;
    --l-border: #E0E6EE;
    --l-border-strong: #C9D2DE;
    --l-navy: #0E2A4E;
    --l-mar: #0E6BA8;

    /* DECK (true high contrast) */
    --d-canvas: #000000;
    --d-surface: #0A0F18;
    --d-surface-2: #121925;
    --d-surface-3: #1A2333;
    --d-text: #FFFFFF;
    --d-text-2: #D6DEE8;
    --d-text-3: #8FA0B6;
    --d-border: #1E2839;
    --d-border-strong: #2C3A52;
    --d-cyan: #00C2FF;

    /* SEMANTIC (calibrated per mode) */
    --lift-l:   #15A34A;
    --lift-d:   #2EF07A;
    --header-l: #E03A2C;
    --header-d: #FF5447;
    --warn-l:   #D97706;
    --warn-d:   #FFB020;
    --info-l:   #0E6BA8;
    --info-d:   #00C2FF;
    --metadata-l: #64748B;
    --metadata-d: #8FA0B6;

    /* BOYAS */
    --b-committee: #D11A2A;
    --b-pin:       #F59E0B;
    --b-windward:  #16A34A;
    --b-leeward:   #1E6FE0;
    --b-gate:      #8B5CF6;
  }

  html, body {
    margin: 0;
    background: #0d1117;
    font-family: "Inter", system-ui, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }

  /* base classes used across screens — keep deliberately small */
  .num { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "ss01" 1; }
  .label { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .hair { height: 1px; }

  /* light theme block */
  .theme-l { background: var(--l-canvas); color: var(--l-text); }
  .theme-l .surface { background: var(--l-surface); }
  .theme-l .surface-2 { background: var(--l-surface-2); }
  .theme-l .surface-3 { background: var(--l-surface-3); }
  .theme-l .border { border-color: var(--l-border); }
  .theme-l .text-2 { color: var(--l-text-2); }
  .theme-l .text-3 { color: var(--l-text-3); }
  .theme-l .nav-bg { background: var(--l-navy); color: #fff; }
  .theme-l .info { color: var(--info-l); }
  .theme-l .lift { color: var(--lift-l); }
  .theme-l .header { color: var(--header-l); }
  .theme-l .warn { color: var(--warn-l); }

  /* deck theme block */
  .theme-d { background: var(--d-canvas); color: var(--d-text); }
  .theme-d .surface { background: var(--d-surface); }
  .theme-d .surface-2 { background: var(--d-surface-2); }
  .theme-d .surface-3 { background: var(--d-surface-3); }
  .theme-d .border { border-color: var(--d-border); }
  .theme-d .text-2 { color: var(--d-text-2); }
  .theme-d .text-3 { color: var(--d-text-3); }
  .theme-d .nav-bg { background: #000; color: #fff; }
  .theme-d .info { color: var(--info-d); }
  .theme-d .lift { color: var(--lift-d); }
  .theme-d .header { color: var(--header-d); }
  .theme-d .warn { color: var(--warn-d); }

  /* phone frame */
  .phone {
    width: 393px;
    height: 852px;
    border-radius: 56px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 11px #1a1f29, 0 0 0 12px #2b3140;
  }
  .phone-screen {
    position: absolute;
    inset: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  /* iOS status bar */
  .statusbar {
    height: 54px;
    padding: 18px 28px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 15px;
    flex-shrink: 0;
  }
  .statusbar .right { display: flex; gap: 7px; align-items: center; }
  .notch {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 122px; height: 36px; border-radius: 20px; background: #000; z-index: 5;
  }

  /* grid lines / instrument vibe */
  .grid-bg {
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 24px 24px;
  }

  /* compass/horizon thin lines */
  .tick { background: currentColor; width: 1px; }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ds-shared.jsx"></script>
